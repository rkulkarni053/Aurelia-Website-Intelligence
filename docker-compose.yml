services:
  postgres:
    image: postgres:18
    container_name: website-intelligence-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: website_intelligence
      POSTGRES_USER: wi_app
      POSTGRES_PASSWORD: wi_dev_password

    volumes:
      - postgres_data:/var/lib/postgresql

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wi_app -d website_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
